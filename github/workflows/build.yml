name: Build Wildkamera APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle wrapper jar
        run: |
          mkdir -p gradle/wrapper
          curl -L https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar \
            -o gradle/wrapper/gradle-wrapper.jar

      - name: Create app icons
        run: |
          pip install Pillow -q
          python3 - << 'PYEOF'
import base64, io
from PIL import Image

b64 = ""
data = base64.b64decode(b64)
img = Image.open(io.BytesIO(data))

sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
import os
for dpi, px in sizes.items():
    os.makedirs(f"app/src/main/res/mipmap-{dpi}", exist_ok=True)
    r = img.resize((px,px), Image.LANCZOS)
    r.save(f"app/src/main/res/mipmap-{dpi}/ic_launcher.png")
    r.save(f"app/src/main/res/mipmap-{dpi}/ic_launcher_round.png")
    print(f"{dpi}: {px}px OK")
PYEOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wildkamera-APK
          path: app/build/outputs/apk/debug/app-debug.apk
